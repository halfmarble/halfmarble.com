<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>halfmarble | SteadyHandTool</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link href="/assets/fonts/fonts.css" rel="stylesheet">
    <style>
        body {
            background-color: #0a0a0a;
            color: #d1d5db;
            font-family: 'Inter', sans-serif;
        }
        .mono { font-family: 'JetBrains Mono', monospace; }
    </style>
    <!-- Tailwind, built from this page's own classes (not the CDN): see tailwind.config.js.
         Keep this LAST in <head>. The old cdn.tailwindcss.com script injected its generated
         <style> at the end of <head>, i.e. AFTER the inline <style> above, so Tailwind won
         cascade ties. Moving this link up next to the font link silently flips that. -->
    <link href="/assets/tailwind.css" rel="stylesheet">
</head>
<body class="antialiased">

    <div class="max-w-6xl mx-auto px-6 py-8">
        <div class="flex justify-between items-center mb-12">
            <a href="index.html" class="mono text-xs text-zinc-600 uppercase tracking-[0.3em] transition" style="text-decoration:none;border-bottom:1px solid transparent;" onmouseover="this.style.borderColor='#d1d5db'" onmouseout="this.style.borderColor='transparent'">&larr; BACK</a>
            <span class="mono text-xs text-zinc-600 uppercase tracking-[0.3em]">01 // Hardware</span>
        </div>

        <h1 class="text-3xl md:text-5xl font-extrabold text-cyan-500 mb-2">SteadyHandTool</h1>
        <p class="text-zinc-500 mb-12">High-stability SMD soldering aid — tremor compensation through mass dampening</p>

        <div class="grid gap-6">
            <div class="border border-zinc-800 overflow-hidden">
                <img src="img/hero-shot.jpg" alt="SteadyHandTool in use — hand holding the tool" class="w-full" style="filter: grayscale(100%) contrast(1.1);">
            </div>
            <div class="grid md:grid-cols-2 gap-6">
                <div class="border border-zinc-800 overflow-hidden">
                    <img src="img/hero-shot2.jpg" alt="SteadyHandTool — profile view" class="w-full" style="filter: grayscale(100%) contrast(1.1);">
                </div>
                <div class="border border-zinc-800 overflow-hidden">
                    <img src="img/hero-shot3.jpg" alt="SteadyHandTool — top down view" class="w-full" style="filter: grayscale(100%) contrast(1.1);">
                </div>
            </div>
        </div>
    </div>

    <div class="max-w-6xl mx-auto px-6 pt-8 pb-4">
        <div class="border-t border-zinc-800 pt-6">
            <p class="mono text-xs text-zinc-600">Photography: Hero images provided by Crowd Supply.</p>
        </div>
    </div>

    <footer class="py-20 text-center border-t border-zinc-900">
        <div class="mono text-xs text-zinc-600 uppercase tracking-widest mb-4">Identity // halfmarble</div>
        <p class="text-zinc-500 text-sm">Small software, built to last, by two people who use it.</p>
        <a href="mailto:info@halfmarble.com" class="mt-6 inline-block text-white font-bold" style="text-decoration:none;border-bottom:1px solid #444;" onmouseover="this.style.borderColor='#d1d5db'" onmouseout="this.style.borderColor='#444'">info@halfmarble.com</a>
    </footer>

</body>
</html>
